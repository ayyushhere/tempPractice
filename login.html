<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — My App</title>
  <style>
    :root{
      --bg:#f4f7fb; --card:#ffffff; --accent:#2563eb; --muted:#6b7280;
      --radius:12px; --shadow: 0 6px 18px rgba(16,24,40,0.08);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%}
    body{
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(180deg,var(--bg),#eef2ff);
      padding:24px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px;
      box-sizing:border-box;
    }

    h1{margin:0 0 8px;font-size:20px}
    p.lead{margin:0 0 18px;color:var(--muted);font-size:14px}

    label{display:block;font-size:13px;margin:12px 0 6px;color:#111827}
    input[type="email"],
    input[type="password"]{
      width:100%;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid #e6e9ef;
      box-sizing:border-box;
      font-size:14px;
      outline: none;
    }
    input:focus{box-shadow:0 0 0 4px rgba(37,99,235,0.08);border-color:var(--accent)}

    .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
    .checkbox{
      display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)
    }

    button{
      margin-top:18px;
      width:100%;
      padding:10px 12px;
      border:none;
      border-radius:10px;
      background:var(--accent);
      color:white;
      font-size:15px;
      cursor:pointer;
    }
    button:active{transform:translateY(1px)}
    .small{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}

    .actions{display:flex;gap:10px;margin-top:12px}
    .toggle-pass{background:transparent;border:none;color:var(--accent);cursor:pointer;font-size:13px}

    /* responsive */
    @media (max-width:420px){
      .card{padding:20px}
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="login-heading">
    <h1 id="login-heading">Welcome back</h1>
    <p class="lead">Sign in to continue to your account</p>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@domain.com" required aria-required="true" />

      <label for="password">Password</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="password" name="password" type="password" placeholder="••••••••" required aria-required="true" style="flex:1" />
        <button type="button" class="toggle-pass" id="togglePass" aria-pressed="false" aria-label="Show password">Show</button>
      </div>

      <div class="row">
        <label class="checkbox"><input type="checkbox" id="remember" name="remember"> Remember me</label>
        <a href="#" style="font-size:13px;color:var(--accent);text-decoration:none">Forgot?</a>
      </div>

      <button type="submit">Sign in</button>

      <div class="small">Don't have an account? <a href="#" style="color:var(--accent);text-decoration:none">Create one</a></div>
    </form>
  </main>

  <script>
    // Basic client-side validation + password toggle
    (function(){
      const form = document.getElementById('loginForm');
      const email = document.getElementById('email');
      const pass = document.getElementById('password');
      const toggle = document.getElementById('togglePass');

      toggle.addEventListener('click', () => {
        const showing = pass.type === 'text';
        pass.type = showing ? 'password' : 'text';
        toggle.textContent = showing ? 'Show' : 'Hide';
        toggle.setAttribute('aria-pressed', String(!showing));
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        // simple checks
        const mailVal = email.value.trim();
        const pwdVal = pass.value;

        if(!mailVal || !/^\S+@\S+\.\S+$/.test(mailVal)){
          alert('Please enter a valid email.');
          email.focus();
          return;
        }
        if(!pwdVal || pwdVal.length < 6){
          alert('Password must be at least 6 characters.');
          pass.focus();
          return;
        }

        // Normally you'd send to server via fetch/ajax here.
        // For demo we just show success
        alert('Logged in (demo) — email: ' + mailVal);
        form.reset();
      });
    })();
  </script>
</body>
</html>
